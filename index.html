<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH Prototype Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SIH Prototype Showcase</h1>
            <p>Smart India Hackathon Project Presentation</p>
        </header>

        <main class="content-wrapper">
            <section class="website-preview">
                <h2>Website Preview</h2>
                <div class="preview-box">
                    <iframe id="website-frame" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </section>

            <section class="youtube-video">
                <h2>YouTube Video</h2>
                <div class="video-box">
                    <iframe id="youtube-frame" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-controls">
                    <input type="text" id="youtube-url" placeholder="Enter YouTube URL or ID">
                    <button onclick="loadYouTubeVideo()">Load Video</button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 SIH Project. All rights reserved.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
