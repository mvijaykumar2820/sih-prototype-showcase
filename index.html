<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH Prototype Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SIH Prototype Showcase</h1>
            <p>Smart India Hackathon Project Presentation</p>
        </header>

        <main>
            <section class="prototype-link">
                <h2>Prototype Link</h2>
                <div class="link-box">
                    <a href="#" class="link-url" id="prototype-link">https://your-prototype-link-here.com</a>
                    <button class="copy-btn" onclick="copyLink('prototype-link')">Copy Link</button>
                </div>
            </section>

            <section class="youtube-video">
                <h2>YouTube Video</h2>
                <div class="video-box">
                    <iframe id="youtube-frame" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe>
                    <div class="video-controls">
                        <input type="text" id="youtube-url" placeholder="Enter YouTube URL or ID">
                        <button onclick="loadYouTubeVideo()">Load Video</button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 SIH Project. All rights reserved.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
